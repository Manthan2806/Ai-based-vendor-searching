
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Management Portal - Auth</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* --- Base Styling --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Soft light background to make the glass effect visible */
            background: linear-gradient(135deg, #fdfbfb 0%, #ffeef0 100%);
            padding: 20px;
        }

        /* --- Glassmorphism Container --- */
        .auth-container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        .header-title {
            text-align: center;
            color: #333;
            font-weight: 600;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        /* --- Tabs --- */
        .tabs {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 5px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            font-size: 1rem;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: #e63946; /* Professional soft red accent */
            color: white;
            box-shadow: 0 4px 15px rgba(230, 57, 70, 0.2);
        }

        /* --- Forms & Inputs --- */
        .form-section {
            display: none; /* Controlled by JS */
        }

        .form-section.active {
            display: block;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: #444;
            margin-bottom: 5px;
            font-weight: 500;
        }

        /* Glassmorphism Inputs */
        .glass-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            font-size: 0.9rem;
            color: #333;
            outline: none;
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            background: rgba(255, 255, 255, 0.8);
            border-color: #e63946;
            box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.1);
        }

        select.glass-input {
            appearance: none;
            cursor: pointer;
        }

        /* --- Buttons & Links --- */
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #e63946;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s ease;
        }

        .submit-btn:hover {
            background: #d62828;
        }

        .toggle-link-container {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #555;
        }

        .toggle-link {
            color: #e63946;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .toggle-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2 class="header-title" id="main-title">Create an Account</h2>

        <div class="tabs">
            <button class="tab-btn active" id="tab-vendor" onclick="switchUserType('vendor')">Vendor</button>
            <button class="tab-btn" id="tab-customer" onclick="switchUserType('customer')">Customer</button>
        </div>

        <div id="register-forms" class="form-section active">
            
            <form id="form-vendor-reg" class="user-form active">
                <div class="input-group">
                    <label>Shop/Business Name</label>
                    <input type="text" class="glass-input" required>
                </div>
                <div class="input-group">
                    <label>Owner Name</label>
                    <input type="text" class="glass-input" required>
                </div>
                <div class="input-group">
                    <label>Primary Service Category</label>
                    <select class="glass-input" required>
                        <option value="" disabled selected>Select a category...</option>
                        <option value="decorator">Decorator</option>
                        <option value="photographer">Photographer</option>
                        <option value="caterer">Caterer</option>
                        <option value="venue">Venue / Banquet</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Business Email</label>
                    <input type="email" class="glass-input" required>
                </div>
                <div class="input-group">
                    <label>Phone Number (Office)</label>
                    <input type="tel" class="glass-input" required>
                </div>
                <div class="input-group">
                    <label>Office Address</label>
                    <input type="text" class="glass-input" required>
                </div>
                <div class="input-group">
                    <label>Service City</label>
                    <input type="text" class="glass-input" required>
                </div>
                <div class="input-group">
                    <label>Set Password</label>
                    <input type="password" class="glass-input" required>
                </div>
                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" class="glass-input" required>
                </div>
                <button type="submit" class="submit-btn">Register as Vendor</button>
            </form>

            <form id="form-customer-reg" class="user-form" style="display: none;">
                <div class="input-group">
                    <label>Customer Name</label>
                    <input type="text" class="glass-input" required>
                </div>
                <div class="input-group">
                    <label>Customer Email</label>
                    <input type="email" class="glass-input" required>
                </div>
                <div class="input-group">
                    <label>Customer Phone No</label>
                    <input type="tel" class="glass-input" required>
                </div>
                <div class="input-group">
                    <label>City</label>
                    <input type="text" class="glass-input" required>
                </div>
                <div class="input-group">
                    <label>Set Password</label>
                    <input type="password" class="glass-input" required>
                </div>
                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" class="glass-input" required>
                </div>
                <button type="submit" class="submit-btn">Register as Customer</button>
            </form>

            <div class="toggle-link-container">
                Already registered? <span class="toggle-link" onclick="toggleAuthMode('login')">Login here</span>
            </div>
        </div>

        <div id="login-forms" class="form-section">
            
            <form id="form-vendor-login" class="user-form active">
                <div class="input-group">
                    <label>Business Email</label>
                    <input type="email" class="glass-input" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" class="glass-input" required>
                </div>
                <button type="submit" class="submit-btn">Login as Vendor</button>
            </form>

            <form id="form-customer-login" class="user-form" style="display: none;">
                <div class="input-group">
                    <label>Customer Email</label>
                    <input type="email" class="glass-input" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" class="glass-input" required>
                </div>
                <button type="submit" class="submit-btn">Login as Customer</button>
            </form>

            <div class="toggle-link-container">
                Not registered? <span class="toggle-link" onclick="toggleAuthMode('register')">Create an account</span>
            </div>
        </div>

    </div>

    <script src="registration.js">
       
    </script>
</body>
</html>
